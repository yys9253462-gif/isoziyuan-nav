<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>导航后台管理 - 爱搜资源</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0f14;--panel:#151b23;--panel2:#1c2530;--line:#2a3542;--text:#edf3fb;--muted:#8e9aaa;--accent:#6ea8fe;--danger:#ff6b6b;--ok:#55d187}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
    .icon-preview{display:flex;align-items:center;gap:10px;min-height:46px;margin-top:7px;color:var(--muted)}.icon-preview img{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#0f141b;border:1px solid var(--line)}
    .wrap{max-width:1180px;margin:0 auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{font-size:23px;margin:0}.top p{color:var(--muted);margin:5px 0 0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}.login{max-width:420px;margin:90px auto}.hidden{display:none!important}.field{display:grid;gap:6px;margin:12px 0}.field label{color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:7px;background:#0f141b;color:var(--text);padding:10px;font:inherit}textarea{min-height:88px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px;padding:9px 13px;cursor:pointer;font:inherit}button:hover{border-color:var(--accent)}button.primary{background:#2563eb;border-color:#3b82f6}button.danger{color:#ff9a9a}button:disabled{opacity:.55;cursor:not-allowed}.layout{display:grid;grid-template-columns:290px 1fr;gap:18px}.status{min-height:22px;color:var(--muted);margin:10px 0}.status.ok{color:var(--ok)}.status.error{color:var(--danger)}.category-list{display:grid;gap:7px;margin-top:14px}.category{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px;border:1px solid transparent;border-radius:7px;cursor:pointer}.category:hover,.category.active{background:var(--panel2);border-color:var(--line)}.category small{color:var(--muted)}.section-title{font-size:16px;margin:0 0 12px}.item-list{display:grid;gap:8px;margin-top:20px}.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:8px;background:#10161e}.item strong{display:block}.item span{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item-actions{display:flex;gap:6px}.hint{color:var(--muted);font-size:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.empty{color:var(--muted);padding:16px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.layout{grid-template-columns:1fr}.two{grid-template-columns:1fr}.wrap{padding:18px 12px}.top{align-items:flex-start;gap:10px}.top button{white-space:nowrap}}
  </style>
</head>
<body>
  <main class="wrap">
    <section id="login-panel" class="panel login">
      <h1>导航后台登录</h1><p class="hint">仅用于管理 isoziyuan-nav 导航内容</p>
      <form id="login-form">
        <div class="field"><label for="username">管理员账号</label><input id="username" autocomplete="username" value="admin" required></div>
        <div class="field"><label for="password">管理员密码</label><input id="password" type="password" autocomplete="current-password" required></div>
        <button class="primary" type="submit">登录后台</button><div id="login-status" class="status"></div>
      </form>
    </section>

    <section id="admin-panel" class="hidden">
      <header class="top"><div><h1>导航后台管理</h1><p>管理分类、网站链接、标签和展示顺序</p></div><button id="logout">退出登录</button></header>
      <div class="layout">
        <aside class="panel">
          <h2 class="section-title">分类管理</h2>
          <div class="field"><label for="category-name">分类名称</label><input id="category-name" placeholder="例如：AI 工具"></div>
          <div class="actions"><button id="add-category" class="primary">新增分类</button><button id="rename-category">重命名</button><button id="delete-category" class="danger">删除分类</button></div>
          <div id="category-list" class="category-list"></div>
        </aside>
        <section class="panel">
          <div class="toolbar"><div><h2 class="section-title">网站管理</h2><div id="selected-category" class="hint">请选择一个分类</div></div><button id="save-all" class="primary">保存全部修改</button></div>
          <form id="item-form">
            <input id="item-id" type="hidden">
            <div class="two"><div class="field"><label for="item-name">网站名称</label><input id="item-name" required></div><div class="field"><label for="item-url">网站链接</label><input id="item-url" type="url" placeholder="https://example.com" required></div></div>
            <div class="field"><label for="item-desc">网站描述</label><textarea id="item-desc" placeholder="一句话介绍这个网站"></textarea></div>
            <div class="two"><div class="field"><label for="item-tags">标签（用逗号分隔）</label><input id="item-tags" placeholder="AI, 工具, 推荐"></div><div class="field"><label for="item-badge">徽标</label><input id="item-badge" placeholder="精选"></div></div>
            <div class="field"><label for="item-color">卡片颜色</label><input id="item-color" type="color" value="#6366f1"></div>
            <div class="field"><label for="item-icon">自定义导航图标（可选）</label><input id="item-icon" type="file" accept="image/png,image/jpeg,image/webp"><div id="item-icon-preview" class="icon-preview">未设置自定义图标</div><div class="hint">支持 PNG、JPG、WebP，最大 280 KB；不上传则显示网站首字母。</div></div>
            <div class="actions"><button class="primary" type="submit">保存网站</button><button id="clear-item" type="button">清空表单</button></div>
          </form>
          <div id="item-list" class="item-list"></div>
          <div id="admin-status" class="status"></div>
        </section>
      </div>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
